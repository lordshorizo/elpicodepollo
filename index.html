<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Pico de Pollo - Cargando...</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1A1A1A;
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        .loader-container {
            text-align: center;
        }
        
        .logo-loader {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #C41E3A 0%, #8B0000 100%);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            margin: 0 auto 20px;
            animation: bounce 1s infinite;
        }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        
        .loading-text {
            font-size: 18px;
            margin-bottom: 10px;
        }
        
        .loading-subtext {
            font-size: 14px;
            opacity: 0.7;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top-color: #D4AF37;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .version-badge {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255,255,255,0.1);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <div class="loader-container">
        <div class="logo-loader">🐔</div>
        <h1 class="loading-text">El Pico de Pollo</h1>
        <p class="loading-subtext">Detectando tu dispositivo...</p>
        <div class="spinner"></div>
    </div>
    
    <div class="version-badge" id="versionBadge">Analizando...</div>

    <script>
        // Función para detectar si es móvil
        function isMobileDevice() {
            const userAgent = navigator.userAgent.toLowerCase();
            const mobileKeywords = [
                'android', 'webos', 'iphone', 'ipad', 'ipod', 
                'blackberry', 'windows phone', 'iemobile', 
                'opera mini', 'mobile', 'touch'
            ];
            
            // Verificar user agent
            const isMobileUA = mobileKeywords.some(keyword => 
                userAgent.includes(keyword)
            );
            
            // Verificar tamaño de pantalla
            const isSmallScreen = window.innerWidth < 968;
            
            // Verificar si es touch device
            const isTouch = 'ontouchstart' in window || 
                           navigator.maxTouchPoints > 0;
            
            return isMobileUA || (isSmallScreen && isTouch);
        }
        
        // Función para detectar si es tablet
        function isTablet() {
            const userAgent = navigator.userAgent.toLowerCase();
            return userAgent.includes('ipad') || 
                   (userAgent.includes('android') && !userAgent.includes('mobile')) ||
                   (window.innerWidth >= 768 && window.innerWidth < 1024);
        }
        
        // Decidir qué versión mostrar
        function redirectToVersion() {
            const mobile = isMobileDevice();
            const tablet = isTablet();
            const versionBadge = document.getElementById('versionBadge');
            
            let targetUrl;
            let versionName;
            
            if (mobile && !tablet) {
                // Móvil → App versión
                targetUrl = 'app.html';
                versionName = 'Versión Móvil';
            } else if (tablet) {
                // Tablet → App versión (mejor experiencia táctil)
                targetUrl = 'app.html';
                versionName = 'Versión Tablet';
            } else {
                // Desktop → Web versión
                targetUrl = 'desktop.html';
                versionName = 'Versión Desktop';
            }
            
            // Mostrar qué versión se cargará
            versionBadge.textContent = versionName;
            
            // Redirigir después de 1.5 segundos (para que vean el logo)
            setTimeout(() => {
                window.location.replace(targetUrl);
            }, 1500);
        }
        
        // Ejecutar al cargar
        window.addEventListener('load', redirectToVersion);
    </script>
</body>
</html>
