<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Pico de Pollo - Web</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #C41E3A;
            --primary-dark: #8B0000;
            --secondary: #D4AF37;
            --accent: #FF6B35;
            --dark: #1A1A1A;
            --light: #F5F5DC;
            --cream: #FFF8DC;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--cream);
            color: var(--dark);
        }

        /* Header Desktop */
        .desktop-header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(196, 30, 58, 0.3);
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 40px;
        }

        .header-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .logo-icon {
            width: 60px;
            height: 60px;
            background: white;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
        }

        .logo-text h1 {
            font-family: 'Playfair Display', serif;
            font-size: 32px;
            font-weight: 900;
        }

        .logo-text span {
            font-size: 13px;
            opacity: 0.9;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .header-search {
            flex: 1;
            max-width: 500px;
            margin: 0 40px;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 14px 24px 14px 50px;
            border: none;
            border-radius: 30px;
            font-size: 15px;
            background: rgba(255,255,255,0.95);
        }

        .search-icon {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: #999;
        }

        .cart-btn {
            background: white;
            color: var(--primary);
            padding: 12px 24px;
            border-radius: 30px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Layout 3 columnas */
        .main-layout {
            display: grid;
            grid-template-columns: 250px 1fr 350px;
            gap: 40px;
            padding: 40px 0;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Sidebar */
        .sidebar {
            position: sticky;
            top: 120px;
            height: fit-content;
        }

        .sidebar-title {
            font-size: 18px;
            font-weight: 800;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 2px solid var(--primary);
        }

        .category-list {
            list-style: none;
        }

        .category-item {
            padding: 14px 20px;
            margin-bottom: 8px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 600;
        }

        .category-item:hover, .category-item.active {
            background: var(--primary);
            color: white;
        }

        /* Products Grid */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 24px;
        }

        .product-card {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            transition: all 0.3s;
        }

        .product-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 40px rgba(0,0,0,0.15);
        }

        .product-image {
            height: 180px;
            background: linear-gradient(135deg, #FFE5B4 0%, #FFDAB9 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 80px;
            position: relative;
        }

        .product-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            background: var(--accent);
            color: white;
            padding: 4px 12px;
            border-radius: 15px;
            font-size: 11px;
            font-weight: 700;
        }

        .product-info {
            padding: 20px;
        }

        .product-title {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .product-desc {
            color: #666;
            font-size: 13px;
            margin-bottom: 12px;
        }

        .product-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .product-price {
            font-size: 20px;
            font-weight: 800;
            color: var(--primary);
        }

        .add-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--primary);
            color: white;
            border: none;
            font-size: 18px;
            cursor: pointer;
        }

        /* Cart Sidebar */
        .cart-sidebar {
            position: sticky;
            top: 120px;
            height: fit-content;
            background: white;
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        .cart-title {
            font-size: 20px;
            font-weight: 800;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 2px solid var(--cream);
        }

        .cart-item {
            display: flex;
            gap: 12px;
            padding: 12px 0;
            border-bottom: 1px solid #eee;
        }

        .cart-item-image {
            width: 50px;
            height: 50px;
            background: var(--cream);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .cart-item-details {
            flex: 1;
        }

        .cart-item-title {
            font-weight: 700;
            font-size: 14px;
        }

        .cart-item-price {
            color: var(--primary);
            font-weight: 700;
            font-size: 14px;
        }

        .quantity-control {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 6px;
        }

        .qty-btn {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 2px solid var(--primary);
            background: white;
            color: var(--primary);
            font-weight: 700;
            cursor: pointer;
        }

        .cart-total {
            display: flex;
            justify-content: space-between;
            font-size: 18px;
            font-weight: 800;
            margin: 20px 0;
            padding-top: 16px;
            border-top: 2px solid var(--cream);
        }

        .checkout-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        .empty-cart {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }

        /* Responsive */
        @media (max-width: 1200px) {
            .main-layout {
                grid-template-columns: 200px 1fr 300px;
                gap: 30px;
            }
        }

        @media (max-width: 968px) {
            .main-layout {
                grid-template-columns: 1fr;
            }
            .sidebar, .cart-sidebar {
                position: relative;
                top: 0;
            }
        }
    </style>
</head>
<body>
    <header class="desktop-header">
        <div class="container">
            <div class="header-flex">
                <div class="logo-section">
                    <div class="logo-icon">🐔</div>
                    <div class="logo-text">
                        <h1>El Pico de Pollo</h1>
                        <span>Pollo Asado & Empanadas</span>
                    </div>
                </div>
                
                <div class="header-search">
                    <i class="fas fa-search search-icon"></i>
                    <input type="text" class="search-input" placeholder="Buscar pollo, empanadas, papas..." id="searchInput">
                </div>
                
                <div class="cart-btn">
                    <i class="fas fa-shopping-cart"></i>
                    Carrito
                    <span id="cartCount">0</span>
                </div>
            </div>
        </div>
    </header>

    <div class="container">
        <div class="main-layout">
            <!-- Sidebar -->
            <aside class="sidebar">
                <h3 class="sidebar-title">Categorías</h3>
                <ul class="category-list">
                    <li class="category-item active" onclick="filterCategory('all', this)">
                        <i class="fas fa-th-large"></i> Todo
                    </li>
                    <li class="category-item" onclick="filterCategory('pollo', this)">
                        <i class="fas fa-drumstick-bite"></i> Pollos
                    </li>
                    <li class="category-item" onclick="filterCategory('empanadas', this)">
                        <i class="fas fa-cookie"></i> Empanadas
                    </li>
                    <li class="category-item" onclick="filterCategory('papas', this)">
                        <i class="fas fa-french-fries"></i> Papas
                    </li>
                    <li class="category-item" onclick="filterCategory('bebidas', this)">
                        <i class="fas fa-glass-whiskey"></i> Bebidas
                    </li>
                </ul>
            </aside>

            <!-- Products -->
            <section>
                <h2 style="font-family: 'Playfair Display', serif; font-size: 28px; margin-bottom: 24px;">Nuestro Menú</h2>
                <div class="products-grid" id="productsGrid"></div>
            </section>

            <!-- Cart -->
            <aside class="cart-sidebar">
                <h3 class="cart-title">🛒 Tu Pedido</h3>
                <div id="cartItems">
                    <div class="empty-cart">
                        <i class="fas fa-shopping-cart" style="font-size: 40px; margin-bottom: 12px; opacity: 0.3;"></i>
                        <p>Tu carrito está vacío</p>
                    </div>
                </div>
                <div id="cartFooter" style="display: none;">
                    <div class="cart-total">
                        <span>Total</span>
                        <span id="cartTotal">$0</span>
                    </div>
                    <button class="checkout-btn" onclick="checkout()">Proceder al Pago</button>
                </div>
            </aside>
        </div>
    </div>

    <script>
        const products = [
            { id: 1, name: "Pollo Entero Asado", category: "pollo", price: 12990, emoji: "🍗", desc: "Marinado 24h, 2 salsas", badge: "Más Vendido" },
            { id: 2, name: "Medio Pollo", category: "pollo", price: 7990, emoji: "🍗", desc: "Para 1-2 personas" },
            { id: 3, name: "Cuarto de Pollo", category: "pollo", price: 4990, emoji: "🍗", desc: "2 presas a elección" },
            { id: 4, name: "Papas Fritas Caseras", category: "papas", price: 3490, emoji: "🍟", desc: "Cortadas a mano", badge: "Caseras" },
            { id: 5, name: "Papas Naturales", category: "papas", price: 2990, emoji: "🥔", desc: "Al horno con romero" },
            { id: 6, name: "Empanada Queso", category: "empanadas", price: 2490, emoji: "🥟", desc: "Queso mozzarella", badge: "Clásica" },
            { id: 7, name: "Queso Pollo", category: "empanadas", price: 2990, emoji: "🥟", desc: "La más pedida", badge: "Favorita" },
            { id: 8, name: "Queso Champiñón", category: "empanadas", price: 2990, emoji: "🥟", desc: "Champiñones salteados" },
            { id: 9, name: "Queso Jaiva", category: "empanadas", price: 3490, emoji: "🥟", desc: "Jaiva con merkén", badge: "Marina" },
            { id: 10, name: "Queso Loco", category: "empanadas", price: 3990, emoji: "🥟", desc: "Locos con salsa blanca", badge: "Premium" },
            { id: 11, name: "Queso Machas", category: "empanadas", price: 3990, emoji: "🥟", desc: "Machas a la parmesana" },
            { id: 12, name: "Queso Pollo Choclo", category: "empanadas", price: 3290, emoji: "🥟", desc: "Pollo, choclo y queso", badge: "Nueva" },
            { id: 13, name: "Bebida 350ml", category: "bebidas", price: 1490, emoji: "🥤", desc: "Coca, Fanta, Sprite" },
            { id: 14, name: "Jugo Natural", category: "bebidas", price: 2490, emoji: "🧃", desc: "Naranja, piña, frutilla" },
            { id: 15, name: "Cerveza Artesanal", category: "bebidas", price: 3990, emoji: "🍺", desc: "Kross, Austral" }
        ];

        let cart = [];

        function renderProducts(filter = 'all') {
            const grid = document.getElementById('productsGrid');
            const filtered = filter === 'all' ? products : products.filter(p => p.category === filter);
            
            grid.innerHTML = filtered.map(product => `
                <div class="product-card">
                    <div class="product-image">
                        ${product.emoji}
                        ${product.badge ? `<span class="product-badge">${product.badge}</span>` : ''}
                    </div>
                    <div class="product-info">
                        <h3 class="product-title">${product.name}</h3>
                        <p class="product-desc">${product.desc}</p>
                        <div class="product-footer">
                            <span class="product-price">$${product.price.toLocaleString()}</span>
                            <button class="add-btn" onclick="addToCart(${product.id})">
                                <i class="fas fa-plus"></i>
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function filterCategory(category, element) {
            document.querySelectorAll('.category-item').forEach(c => c.classList.remove('active'));
            element.classList.add('active');
            renderProducts(category);
        }

        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            const existing = cart.find(item => item.id === productId);
            
            if (existing) {
                existing.quantity++;
            } else {
                cart.push({ ...product, quantity: 1 });
            }
            
            updateCart();
        }

        function updateCart() {
            const cartItems = document.getElementById('cartItems');
            const cartFooter = document.getElementById('cartFooter');
            const cartCount = document.getElementById('cartCount');
            const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
            const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            
            cartCount.textContent = totalItems;
            
            if (cart.length === 0) {
                cartItems.innerHTML = `
                    <div class="empty-cart">
                        <i class="fas fa-shopping-cart" style="font-size: 40px; margin-bottom: 12px; opacity: 0.3;"></i>
                        <p>Tu carrito está vacío</p>
                    </div>
                `;
                cartFooter.style.display = 'none';
            } else {
                cartItems.innerHTML = cart.map(item => `
                    <div class="cart-item">
                        <div class="cart-item-image">${item.emoji}</div>
                        <div class="cart-item-details">
                            <div class="cart-item-title">${item.name}</div>
                            <div class="cart-item-price">$${item.price.toLocaleString()}</div>
                            <div class="quantity-control">
                                <button class="qty-btn" onclick="updateQuantity(${item.id}, -1)">-</button>
                                <span>${item.quantity}</span>
                                <button class="qty-btn" onclick="updateQuantity(${item.id}, 1)">+</button>
                            </div>
                        </div>
                    </div>
                `).join('');
                cartFooter.style.display = 'block';
                document.getElementById('cartTotal').textContent = '$' + totalPrice.toLocaleString();
            }
        }

        function updateQuantity(productId, change) {
            const item = cart.find(i => i.id === productId);
            if (item) {
                item.quantity += change;
                if (item.quantity <= 0) {
                    cart = cart.filter(i => i.id !== productId);
                }
                updateCart();
            }
        }

        function checkout() {
            if (cart.length === 0) return;
            alert('¡Gracias por tu pedido! Total: ' + document.getElementById('cartTotal').textContent);
        }

        renderProducts();
    </script>
</body>
</html>
